name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Check, test, and check formatting
        run: devenv test
      - name: Test with every backend
        run: devenv shell just test-all
      - name: Run the README examples
        run: devenv shell just examples
      - name: Compare against Python's uuid module
        run: devenv shell just diff --count 5000
      - name: Compare speed with Rust, Go and Python
        # Runner timings are noisy, so this only keeps the comparison
        # programs building and records the numbers in the job summary
        shell: bash
        run: devenv --profile bench shell just bench-compare | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fuzz for 60 seconds
        run: devenv shell just fuzz 60
